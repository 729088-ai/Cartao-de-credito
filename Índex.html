<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cartao</title>
<style>
body{background:#f5f5f5;font-family:Arial;padding:20px}
.caixa{background:#fdf8f0;border:2px solid #cbb89c;border-radius:20px;max-width:650px;margin:auto;padding:25px}
label{display:block;margin-top:12px;font-weight:bold}
input[type=text],input[type=number],input[type=date]{width:100%;padding:8px;border:1px solid #999;border-radius:5px;box-sizing:border-box}
button{display:block;margin:30px auto 0;padding:12px 45px;background:#2b6cb0;color:white;border:none;border-radius:8px;font-size:16px}
</style>
</head>
<body>
<div class="caixa">
<h2 style="text-align:center">Cadastro de Pagamento do Cartao de Credito</h2>
<label>Seu nome:</label><input type="text">
<label>Saldo atual:</label><input type="number">
<label>Data de validade:</label><input type="date">
<p><b>Data de pagamento:</b></p>
<label><input type="radio" name="pag"> Antes do dia 05</label>
<label><input type="radio" name="pag"> Dia 05</label>
<label><input type="radio" name="pag"> Apos dia 05</label>
<p><b>Forma de pagamento:</b></p>
<label><input type="checkbox"> Casas lotericas</label>
<label><input type="checkbox"> Pela internet</label>
<label><input type="checkbox"> Agencia bancaria</label>
<button>Cadastrar dados</button>
</div>
</body>
</html>
